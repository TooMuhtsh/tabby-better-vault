<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#f6f7f9" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="44" rx="14" fill="#24292f"/>
  <rect x="0" y="30" width="960" height="14" fill="#24292f"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text x="480" y="27" text-anchor="middle" fill="#c9d1d9" font-size="14">Tabby — Settings</text>

  <!-- Left rail -->
  <rect x="24" y="68" width="190" height="488" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <g font-size="15" fill="#57606a">
    <text x="46" y="104">General</text>
    <text x="46" y="140">Appearance</text>
    <text x="46" y="176">Terminal</text>
    <text x="46" y="212">Profiles &amp; connections</text>
    <text x="46" y="248">Hotkeys</text>
  </g>
  <!-- Active item: Better Tabby -->
  <rect x="24" y="270" width="6" height="40" fill="#0d9488"/>
  <rect x="30" y="270" width="184" height="40" fill="#0d948814"/>
  <text x="46" y="295" font-size="15" font-weight="600" fill="#0d9488">🧩 Better Tabby</text>

  <!-- Main panel -->
  <rect x="238" y="68" width="698" height="488" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="270" y="112" font-size="22" font-weight="700" fill="#1f2328">Better Tabby</text>
  <text x="270" y="136" font-size="13.5" fill="#57606a">One shared tab. Two independent plugins, each contributing its own page.</text>

  <!-- Sub-tab pills -->
  <rect x="270" y="158" width="150" height="38" rx="19" fill="#d9770614"/>
  <text x="345" y="182" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">🔐 Vault</text>
  <rect x="270" y="158" width="150" height="38" rx="19" fill="none" stroke="#d97706" stroke-width="2"/>

  <rect x="432" y="158" width="170" height="38" rx="19" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="517" y="182" text-anchor="middle" font-size="14.5" font-weight="600" fill="#57606a">📁 Sidebar</text>

  <!-- Vault page mock content -->
  <g>
    <rect x="270" y="222" width="636" height="52" rx="8" fill="#fbfbfb" stroke="#eaeef2"/>
    <text x="290" y="243" font-size="13.5" fill="#1f2328" font-weight="600">Enable on this machine</text>
    <text x="290" y="261" font-size="12" fill="#6e7781">Unlock the vault automatically via the OS keychain</text>
    <rect x="850" y="235" width="40" height="22" rx="11" fill="#0d9488"/>
    <circle cx="880" cy="246" r="9" fill="#ffffff"/>

    <rect x="270" y="286" width="636" height="52" rx="8" fill="#fbfbfb" stroke="#eaeef2"/>
    <text x="290" y="307" font-size="13.5" fill="#1f2328" font-weight="600">Expiry</text>
    <text x="290" y="325" font-size="12" fill="#6e7781">Weekly · sliding delay · never</text>
    <rect x="806" y="298" width="84" height="26" rx="13" fill="#eef2f5"/>
    <text x="848" y="315" text-anchor="middle" font-size="11.5" fill="#57606a">Weekly ▾</text>

    <rect x="270" y="350" width="636" height="52" rx="8" fill="#fbfbfb" stroke="#eaeef2"/>
    <text x="290" y="371" font-size="13.5" fill="#1f2328" font-weight="600">Audit log</text>
    <text x="290" y="389" font-size="12" fill="#6e7781">Vault openings, expiries, revocations — never the passphrase</text>
  </g>

  <!-- Connector bracket to family section -->
  <path d="M 270 428 H 906" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="270" y="454" font-size="12.5" fill="#6e7781">Both pages are contributed independently via a shared string token —</text>
  <text x="270" y="472" font-size="12.5" fill="#6e7781">neither plugin imports or depends on the other.</text>
  <rect x="270" y="490" width="310" height="30" rx="6" fill="#0d948810"/>
  <text x="286" y="510" font-size="12.5" font-family="Consolas, monospace" fill="#0d9488">BetterPanelContribution:vault</text>

  <rect x="596" y="490" width="310" height="30" rx="6" fill="#2563eb10"/>
  <text x="612" y="510" font-size="12.5" font-family="Consolas, monospace" fill="#2563eb">BetterPanelContribution:sidebar</text>

  <text x="270" y="548" font-size="12" fill="#8b949e">Stylised mock-up, not a pixel-accurate screenshot.</text>
</svg>
